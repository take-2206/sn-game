function txt(s,x,y,size,col){c.font='bold '+size+'px "Courier New",monospace';c.textAlign='center';c.fillStyle='#fff8';c.fillText(s,x+1,y+1);c.fillStyle=col||INK;c.fillText(s,x,y)}

function reset(){
  d=0;y=G-18;vy=0;hp=3;score=0;inv=0;pops=[];lvl=[];got=[];
  for(let x=380;x<GOAL;x+=90+(Math.random()*80|0)){
    if(Math.random()<.35) lvl.push({x,y:G-14,w:16,h:14,k:'o'});
    else lvl.push({x,y:G-(Math.random()<.5?26:64),w:22,h:22,k:'c',on:1,s:Math.random()*NC|0});
  }
}
function jump(){
  if(st==='shop'){if(!blown){blown=true;spawnConf()}else{reset();st='play'}return}
  if(st==='ready'||st==='over'||st==='win'){reset();st='play';return}
  if(y>=G-18) vy=-8.2;
}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}});
cv.addEventListener('pointerdown',jump);
reset();

function update(){
  t++;
  if(st==='shop'){shopT++;confetti.forEach(p=>{p.y+=p.v;p.x+=Math.sin((t+p.o)/12)*.5});confetti=confetti.filter(p=>p.y<H+10);return}
  if(st!=='play') return;
  const px0=d+70;
  const bakeryDoor=GOAL+215;
  const speed=px0>=GOAL+150?1.4:2.2+d/GOAL*1.3;
  d+=speed;
  vy+=.45;y+=vy;
  if(y>=G-18){y=G-18;vy=0}
  if(inv>0)inv--;
  const px=d+70;
  for(const it of lvl){
    if(it.k==='c'&&!it.on)continue;
    if(px+14>it.x&&px<it.x+it.w&&y+18>it.y&&y<it.y+it.h){
      if(it.k==='c'){it.on=0;score+=10;got.push(it.s);pops.push({x:it.x,y:it.y,t:0})}
      else if(inv<=0){inv=70;vy=-4}
    }
  }
  pops.forEach(p=>p.t++);pops=pops.filter(p=>p.t<35);
  if(px>=bakeryDoor){st='shop';shopT=0;blown=false;confetti=[];best=Math.max(best,score)}
}


function bush(x){r(x,G-22,34,22,'#a9c93a');r(x+6,G-30,22,10,'#bcd94d');r(x+4,G-16,8,6,'#8fb02b')}

function spawnConf(){const cl=['#ff5d8f','#ffd23f','#4ecdc4','#a98bff','#ff9a3c'];for(let i=0;i<80;i++)confetti.push({x:Math.random()*W,y:-Math.random()*220,v:.8+Math.random()*1.6,o:Math.random()*100,c:cl[i%5]})}
// Vẽ cảnh bên trong tiệm bánh (chạy mỗi khung hình khi st==='shop')
// r(x, y, rộng, cao, màu) = vẽ một khối chữ nhật
function drawShop(){
  // --- NỀN TƯỜNG ---
  r(0,0,W,H,'#ffd9e6');                                   // tô hồng toàn màn hình
  for(let x=0;x<W;x+=32)r(x,34,16,198,'#ffcfe0');         // sọc dọc hồng đậm hơn trên tường

  // --- MÁI HIÊN SỌC ĐỎ TRẮNG Ở TRÊN CÙNG ---
  r(0,0,W,30,'#fff');                                     // nền trắng
  for(let x=0;x<W;x+=40)r(x,0,20,30,'#e0455f');           // cứ 40px lại có 1 sọc đỏ rộng 20px
  r(0,30,W,4,'#a52a1e');                                  // viền nâu đỏ dưới mái hiên

  

  // --- LỜI CHÚC Ở GIỮA PHÍA TRÊN ---
  // blown = true nghĩa là đã thổi nến, lúc đó đổi sang câu chúc thứ hai
  txt(blown?'Hope your day is as sweet as cake!':'Happy Birthday!',W/2,66,20,'#a52a1e');

  // --- BÁNH SINH NHẬT LỚN (ảnh pixel-art) ---
  const CW=232,CH=185,cx0=Math.round(W/2-CW/2),cy0=100;
  if(bigCake.complete&&bigCake.naturalWidth){
    c.imageSmoothingEnabled=true;                          // thu nhỏ ảnh 2x cho mịn
    c.drawImage(bigCake,cx0,cy0,CW,CH);
    c.imageSmoothingEnabled=false;
  }

  // --- NGỌN LỬA TRÊN CÂY NẾN CỦA BÁNH ---
  const fx=cx0+Math.round(CW*0.4951);                   // tâm cây nến
  if(!blown){
    const f=Math.floor(t/6)%2;                             // nhấp nháy
    r(fx-3,cy0-13-f,6,11+f,'#ffb347');                     // lửa ngoài màu cam
    r(fx-1,cy0-10-f,2,7,'#fff2a0');                        // lõi lửa
  }else{
    r(fx-1,cy0-9,3,7,'#cfc6c6');                           // đã thổi: làn khói xám
  }

  // --- DÒNG HƯỚNG DẪN Ở DƯỚI CÙNG ---
  txt('Press to blow out the candles',W/2,300,12,'#4a2e22');

  // --- PHÁO GIẤY (chỉ có sau khi thổi nến; vị trí được cập nhật trong hàm update) ---
  confetti.forEach(p=>r(p.x,p.y,4,4,p.c));

  // --- HIỆU ỨNG MỜ DẦN KHI VỪA VÀO TIỆM ---
  // shopT đếm khung hình từ lúc vào tiệm; trong 30 khung đầu, lớp trắng mờ dần từ đậm sang trong
  if(shopT<30){c.globalAlpha=1-shopT/30;r(0,0,W,H,'#fff');c.globalAlpha=1}
}
function draw(){
  if(st==='shop'){drawShop();return}
  r(0,0,W,H,'#ffdff0');
  if(bg.complete&&bg.naturalWidth)c.drawImage(bg,0,0,W,H);
  for(let i=0;i<16;i++){
    const m=W+40;
    r(((i*32-d)%m+m)%m-20,G+14+(i%2)*16,10,8,'#ff9db8');
  }
  // bakery
const bx=GOAL+170-d;
if(bx<W+20 && shop.complete && shop.naturalWidth){
  const sh=Math.round(SW*shop.naturalHeight/shop.naturalWidth);
  c.drawImage(shop,Math.round(bx),G-sh,SW,sh);   // đáy ảnh chạm mặt đường
}
  // items
  for(const it of lvl){
    const sx=it.x-d;if(sx<-30||sx>W+30)continue;
    if(it.k==='o'){
      r(sx,it.y,it.w,it.h,'#a8704a');r(sx,it.y,it.w,3,'#c58b5e');r(sx+7,it.y,2,it.h,'#7d4f31');
    }else if(it.on){
      const bob=Math.sin((t+it.x)/10)*2;
      const yy=it.y+bob;
      c.drawImage(cakes,it.s*24,0,24,24,Math.round(sx-1),Math.round(yy-1),24,24);
    }
  }
  // player (nhân vật bằng ảnh: 2 khung đi bộ + 1 khung nhảy)
  const px=70;
  if(!(inv>0&&Math.floor(inv/5)%2)){
    const onGround=y>=G-18;
    const k=onGround?(Math.floor(t/8)%2?'pWalk2':'pWalk1'):'pJump';
    const im=k==='pJump'?pJump:(k==='pWalk2'?pWalk2:pWalk1),[pw,ph]=PSZ[k];
    if(im.complete&&im.naturalWidth){
      c.imageSmoothingEnabled=true;
      c.drawImage(im,Math.round(px+7-pw/2),Math.round(y+19-ph),pw,ph);   // chân chạm mặt đường, căn giữa theo hitbox
      c.imageSmoothingEnabled=false;
    }
  }
  // pops
  for(const p of pops)txt('+10',p.x-d+6,p.y-p.t*.6,9,'#d9392b');
  // hud
  c.textAlign='right';c.font='bold 14px "Courier New",monospace';c.fillStyle=INK;c.fillText('cake: '+score,W-10,22);
  r(10,12,100,5,'#4a2e2255');r(10,12,Math.min(100,100*d/(GOAL+145)),5,'#ff3b5c');
  // overlays

}
let last=0,acc=0;
function loop(ts){
  acc+=Math.min(ts-last,100);last=ts;
  while(acc>=16.67){update();acc-=16.67}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
